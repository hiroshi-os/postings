name: CI

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check code formatting and build
        run: ./gradlew spotlessCheck build -Djqwik.tries=500

      - name: Run crash harness smoke test
        run: ./gradlew :crash:run --args="--runs 20 --seed ${{ github.run_id }}"
